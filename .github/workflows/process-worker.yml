name: Process Worker
on:
  schedule:
    # Every five minutes, offset from the start of the hour.
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: korat-external-worker
  cancel-in-progress: false
jobs:
  process:
    # Configure repository secrets, test manually, then enable the schedule.
    if: github.event_name == 'workflow_dispatch' || vars.WORKER_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Invoke authenticated worker
        run: node scripts/invoke-worker.mjs
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
